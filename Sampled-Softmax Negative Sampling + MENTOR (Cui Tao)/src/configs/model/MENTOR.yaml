embedding_size: 64
feat_embed_dim: 64

n_mm_layers: 1
n_layers: 2
knn_k: 10
mm_image_weight: 0.1
use_id_residual: False
use_feature_adapter: False
feature_adapter_dim: 64
feature_adapter_dropout: 0.1
feature_adapter_alpha: 0.1
# ===== [GRAPH-REFRESH] rebuild item kNN graph from adapted features every N epochs (0 = off) =====
mm_adj_refresh_interval: 0
# ===== [SSM] ranking loss upgrade (not in original MENTOR) =====
# num_negatives: negatives sampled per interaction (1 = original BPR behaviour)
# loss_type: 'bpr' (original) or 'softmax' (sampled softmax over K negatives, SimpleX-style)
# ssm_temp: softmax temperature (lower = sharper focus on hardest negatives)
num_negatives: 1
loss_type: 'bpr'
ssm_temp: 1.0
# ===== [SSM] end =====

# ===== [HARD-NEG] content-guided hard negative sampling (not in original MENTOR) =====
# Fraction of BPR negatives drawn from the positive item's kNN lookalikes (mm_adj).
# 0.0 reproduces original MENTOR exactly (pure random negatives).
hard_neg_ratio: 0.5
hard_neg_warmup_epochs: 3   # epochs of pure random negatives first
hard_neg_ramp_epochs: 5     # epochs to linearly ramp from 0 to hard_neg_ratio
# ===== [HARD-NEG] end =====
learning_rate: [0.0001]
reg_weight: [0.001]

#dropout: [0.3 0.5]
#dropout: [0.1, 0.3, 0.5, 0.7]
dropout: [0.5]

#mask_weight_f: [1, 2]
#mask_weight_f: [1, 1.5, 2, 2.5, 3]
mask_weight_f: [1.5]

#mask_weight_g: [0, 0.01, 0.1]
#mask_weight_g: [0.01, 0.001, 0]
# [HARD-NEG run] pinned to best combo from Jun-28 baseline run
mask_weight_g: [0.0001]

#align_weight: [0.1, 0.2, 0.3]
align_weight: [0.1]

#temp: [0.2, 0.4, 0.8]
# [HARD-NEG run] pinned to best combo from Jun-28 baseline run
temp: [0.2]

hyper_parameters: ["reg_weight", "learning_rate", 'dropout', 'mask_weight_f', 'mask_weight_g', 'align_weight', 'temp']
